services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  
        max-file: "3"
    depends_on:
      - frontend
      - backend_api
    networks:
      - app_network

  certbot:
    image: certbot/certbot
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
  frontend:
    image: ghcr.io/mashta-lilia/handwriter/frontend:latest
    restart: unless-stopped
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  
        max-file: "3"
    depends_on:
      - backend_api
    networks:
      - app_network

  backend_api:
    image: ghcr.io/mashta-lilia/handwriter/backend:latest
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  ml_worker:
    image: ghcr.io/mashta-lilia/handwriter/ml_worker:latest
    restart: unless-stopped
    build:
      context: ./ml_core
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1.5'      
          memory: 16GB     
        reservations:
          memory: 4GB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"
    depends_on:
      - redis
      - db
      - minio
    networks:
      - app_network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 4G        
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000" 
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 admin ${MINIO_ROOT_PASSWORD};
      mc mb myminio/handwriting-assets || true;
      mc mb myminio/handwriting-words || true;
      mc anonymous set public myminio/handwriting-assets;
      mc anonymous set public myminio/handwriting-words;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  app_network:
    driver: bridge